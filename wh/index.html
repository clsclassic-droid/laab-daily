<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>คลังกลาง — ระบบบัญชี</title>
<style>
  /* สี ฟอนต์ มุมปุ่ม มาจากชุดสีกลาง shared/tokens.js (ใส่ตอนโหลด app.js) */
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
  #app{max-width:860px;margin:0 auto;padding:0 12px 40px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
  h1{font-size:22px;margin:0} h2{font-size:17px;margin:0 0 10px}
  nav a{color:var(--ink);margin-left:12px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .seg{display:inline-flex;border:1px solid var(--ink);border-radius:var(--r-btn);overflow:hidden;margin-left:auto}
  .seg button{background:#fff;color:var(--ink);border-radius:0;padding:10px 22px}
  .seg button.on{background:var(--ink);color:#fff}
  .tabs{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-bottom:2px solid var(--line);margin-bottom:12px}
  .tabs button{background:none;color:var(--muted);border-radius:0;padding:12px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-bottom:12px}
  .login{max-width:340px;margin:60px auto}
  label{display:block;font-size:14px;margin:8px 0}
  label input,label select{display:block;margin-top:4px}
  label.chk{display:flex;gap:8px;align-items:center} label.chk input{display:inline;margin:0}
  input,select{font:inherit;padding:9px 10px;border:1px solid var(--input-line);border-radius:var(--r-input);background:var(--card);color:var(--ink);box-sizing:border-box;min-height:var(--tap)}
  input.num{text-align:right;width:7em}
  select.dest{min-width:8.5em;padding:6px 8px}
  button{font:inherit;font-weight:600;padding:11px 18px;border-radius:var(--r-btn);border:0;background:var(--ink);color:#fff;cursor:pointer;min-height:var(--tap)}
  button:disabled{opacity:.5} button.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)} button.sm{padding:8px 14px}
  button.link{background:none;color:var(--ink);text-decoration:underline;padding:9px 10px;font-weight:500;min-height:40px}
.tabs::-webkit-scrollbar{display:none}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.arrow{font-size:22px;padding-bottom:16px}
  .scroll{overflow-x:auto}
  table.grid{border-collapse:collapse;font-size:15px;margin:6px 0;width:100%}
  .grid th{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
  .grid th:first-child{text-align:left}
  .grid td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .grid tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
  .kv td:first-child{width:60%}
  .r{text-align:right;white-space:nowrap}.nw{white-space:nowrap}.b{font-weight:700}
  .green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}.small{font-size:13px}.pad{padding:12px}
  .warn{background:var(--warn);padding:8px 10px;border-radius:var(--r-input);font-size:14px}
  .tag{font-size:12px;background:var(--line);border-radius:var(--r-chip);padding:2px 6px;margin-left:6px;font-weight:500}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r-btn);z-index:9;max-width:90vw}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:var(--r-btn);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .stat b{font-size:22px}
  h3{font-size:15px;margin:14px 0 6px}
  /* เมนู + วันที่แถวเดียว (14 พ.ย.) */
  .tabrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap-reverse;border-bottom:2px solid var(--line);margin:8px 0 12px}
  .tabrow .tabs{border-bottom:0;margin:0;flex:1 1 auto}
  .tabrow .datepill{margin-left:auto}
  .datepill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--card)}
  .datepill button{background:none;color:var(--muted);font-size:20px;padding:0 12px;min-height:var(--tap)}
  .datepill input{border:0;min-height:var(--tap);padding:6px 2px;background:none;width:auto;max-width:9.5em}
  /* ซื้อของแบบร้านลาบ (14 พ.ย. ภาพตัวอย่าง v9) */
  .qwarn{border:1px solid var(--red);background:#fdecea;color:var(--red);border-radius:var(--r-input);padding:6px 12px;margin:8px 0;font-weight:600;font-size:15px}
  .qtools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .qtools button.lt{border-color:var(--line)} .qtools input{flex:1 1 180px;min-width:0}
  .qg{border-bottom:2px solid var(--ink);padding:14px 0 6px;font-weight:700;white-space:nowrap}
  .qg small{display:inline;white-space:normal;font-weight:400;color:var(--muted);font-size:14px;margin-left:12px}
  .qc{border-bottom:1px solid var(--line)}
  .qh{display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer;min-height:var(--tap);box-sizing:border-box}
  .qa{font-size:11px;color:var(--muted);width:12px} .qct{color:#2f6fdb;font-weight:600}
  .qsum{margin-left:auto;color:#2f6fdb;font-weight:700;white-space:nowrap}
  .qr{padding:2px 0 8px 14px;background:#faf9f6}
  .qi{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:8px 12px;margin:0 0 6px;background:var(--card);border-radius:10px;box-shadow:0 1px 0 #eee}
  .qi.pend{background:#fff4e5;outline:1px solid #f0a040} .qi.busy{opacity:.6}
  .qn{flex:1 1 200px;min-width:0}.qn b{font-weight:600;font-size:17px}.qn small{color:var(--muted);font-size:15px;margin-left:8px}
  .qv{order:3;margin:0;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer;user-select:none}
  .qv.on{color:#0a7a3a;border-color:#0a7a3a;font-weight:600} .qv input{display:none}
  .qm{order:4}.qo{order:2;display:flex;align-items:center;gap:0 14px;flex-wrap:wrap}
  .qp{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .ql{color:var(--muted);font-size:15px}
  select.qs{font:inherit;font-size:16px;border:0;border-radius:6px;padding:0 2px;background:transparent;color:#6b3fa0;-webkit-appearance:none;appearance:none;min-height:38px;margin:0}
  select.qs.chg{background:#fff4d6;color:#8a5a00;font-weight:600}
  .qm{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted)}
  .qm .qx{width:70px;min-height:40px;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:0 4px;font-size:17px;text-align:right;background:transparent;margin:0}
  .qm .qx:focus{outline:none;border-bottom-color:#2f6fdb;background:#f2f6ff} .qm .qx.off{background:#fdecea;color:var(--red)}
  .qu{font-size:15px} .qt{min-width:72px;text-align:right;color:var(--ink)}
  .qadd{display:flex;gap:20px;padding:4px 0} .qadd .link{padding:6px 0;color:#2f6fdb}
  @media(max-width:560px){
    #app{padding:0 8px 40px} .card{padding:12px 10px} .qr{padding-left:0}
    .qi{padding:10px;gap:0} .qn{flex-basis:100%;padding-right:56px} .qv{position:absolute;top:8px;right:10px} .qo{flex-basis:100%;gap:0 10px}
    .qm{flex-basis:100%;justify-content:flex-end;border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
    .qadd{gap:24px} .lg{display:none} .qwarn{font-size:14px} h1{font-size:20px}
    .qg small{display:block;margin:2px 0 0} .tabrow .datepill{margin:0 auto 0 0}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
